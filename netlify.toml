# Configuración de Netlify

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Evitar acceso a archivos privados desde la web
[[headers]]
  for = "/*.gs"
  [headers.values]
    X-Robots-Tag = "noindex"

# Panel Administrativo: Prohibido indexar por motores de búsqueda
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/*.gs"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*.xlsx"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*.pdf"
  to = "/404"
  status = 404

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
